[project]
name = "ai-skill-engine"
version = "0.1.0"
description = "AI 工作循环技能引擎：洋葱模型 + 注册表模式的可扩展 AI 工程化底座"
requires-python = ">=3.10"
dependencies = [
    "pydantic[email]>=2.5",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
# 真实 LLM 调用所需（skills/user_extractor.py 内部延迟导入，离线环境可不安装）
llm = [
    "instructor>=1.4",
    "litellm>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
